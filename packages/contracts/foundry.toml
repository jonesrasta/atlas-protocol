[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.30"
evm_version = "prague"

optimizer = true
optimizer_runs = 1000000

via_ir = true

fs_permissions = [
    { access = "read-write", path = "./" }
]

gas_reports = ["*"]

[fuzz]
runs = 1000

[invariant]
runs = 100
depth = 100
fail_on_revert = true
