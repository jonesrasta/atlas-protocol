name: Smart Contracts CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Foundry
      # -------------------------

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            ~/.foundry/bin
          key: ${{ runner.os }}-foundry

      # -------------------------
      # Node.js
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # -------------------------
      # Python (Slither)
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer

      # -------------------------
      # Rust (Aderyn)
      # -------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo

      - name: Install Aderyn
        run: |
          if ! command -v aderyn >/dev/null 2>&1; then
            cargo install --git https://github.com/Cyfrin/aderyn.git aderyn
          fi

      # -------------------------
      # Quality
      # -------------------------

      - name: Check Formatting
        run: forge fmt --check

      - name: Solidity Lint
        run: npx solhint "src/**/*.sol"

      - name: Build
        run: forge build --sizes

      - name: Unit Tests
        run: forge test -vv

      - name: Coverage
        run: forge coverage --report summary

      # -------------------------
      # Security Analysis
      # -------------------------

      - name: Slither
        run: |
          slither . \
            --config-file security/slither.config.json \
            --exclude timestamp,pragma,unimplemented-functions

      - name: Aderyn
        run: aderyn .
